<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCII Christmas Tree 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #060913;
      color: #e6f1ff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .hud {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
      gap: 12px;
      flex-wrap: wrap;
    }
    .badge {
      background: rgba(12, 18, 34, 0.72);
      border: 1px solid rgba(130, 180, 255, 0.22);
      backdrop-filter: blur(8px);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      color: #cbd8f0;
    }
    .controls {
      pointer-events: auto;
      display: flex;
      gap: 8px;
    }
    button {
      background: rgba(24, 38, 70, 0.85);
      color: #f4f8ff;
      border: 1px solid rgba(145, 195, 255, 0.35);
      padding: 8px 12px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button:hover { background: rgba(45, 70, 125, 0.95); }
    .greeting {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 0 18px rgba(255, 215, 120, 0.45);
    }
    .greeting h1 {
      font-size: clamp(18px, 3.2vw, 32px);
      letter-spacing: 3px;
      color: #ffe8a3;
      min-height: 1.3em;
    }
    .greeting p {
      margin-top: 6px;
      font-size: 12px;
      color: #9fb3d9;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="badge">3D ASCII TREE • Kéo chuột để xoay • Cuộn để zoom</div>
    <div class="controls">
      <button id="soundBtn">Bật nhạc</button>
      <button id="pauseBtn">Tạm dừng</button>
      <button id="resetBtn">Đặt lại</button>
    </div>
  </div>

  <canvas id="scene"></canvas>

  <div class="greeting">
    <h1 id="msgText"></h1>
    <p id="subText"></p>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const customMsg = (params.get("msg") || "MERRY CHRISTMAS 2026").toUpperCase();
    const customAuthor = params.get("by") || "";

    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    const msgEl = document.getElementById("msgText");
    const subEl = document.getElementById("subText");
    if (customAuthor) subEl.textContent = customAuthor;

    let W = 0, H = 0, dpr = 1;
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    // --- 3D ASCII Point Cloud ---
    const points = [];
    const tiers = 22;
    for (let t = 0; t < tiers; t++) {
      const yNorm = t / (tiers - 1); // 0 (top) -> 1 (bottom)
      const y = -2.2 + yNorm * 4.4;
      const maxR = 0.12 + yNorm * 1.85;
      const count = Math.floor(28 + yNorm * 110);
      for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2 + t * 0.65;
        const rFrac = Math.pow(Math.random(), 0.55);
        const r = maxR * rFrac;
        const droop = Math.pow(rFrac, 1.5) * 0.24;
        const isTip = rFrac > 0.86;
        const isSnow = isTip && Math.random() < 0.45;
        const isLight = isTip && Math.random() < 0.14;
        const isOrnament = !isLight && Math.random() < 0.035;

        let char = "*";
        let color = "#2ea858";
        let glow = false;

        if (rFrac < 0.35) {
          char = ".";
          color = "#134e2a";
        } else if (isSnow) {
          char = "+";
          color = "#e9f5ff";
        }

        if (isLight) {
          const palette = ["#ff595e", "#ffca3a", "#6ee7ff", "#ff8fab"];
          char = "o";
          color = palette[(t + i) % palette.length];
          glow = true;
        } else if (isOrnament) {
          const balls = ["#ff3b30", "#ffd60a", "#e5e7eb"];
          char = "@";
          color = balls[(t * 3 + i) % balls.length];
          glow = true;
        }

        points.push({
          x: Math.cos(angle) * r,
          y: y + droop,
          z: Math.sin(angle) * r,
          char,
          color,
          glow,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    // Thân cây
    for (let i = 0; i < 90; i++) {
      const y = 2.2 + Math.random() * 0.75;
      const angle = Math.random() * Math.PI * 2;
      const r = 0.28 * Math.sqrt(Math.random());
      points.push({
        x: Math.cos(angle) * r,
        y,
        z: Math.sin(angle) * r,
        char: "|",
        color: "#8d5524",
        glow: false,
        phase: Math.random() * Math.PI * 2
      });
    }

    // Tuyết rơi
    const snow = Array.from({ length: 120 }, () => ({
      x: (Math.random() - 0.5) * 10,
      y: Math.random() * 8 - 4,
      z: (Math.random() - 0.5) * 10,
      speed: 0.5 + Math.random() * 0.9,
      drift: Math.random() * Math.PI * 2
    }));

    // Sao trời
    const stars = Array.from({ length: 90 }, () => ({
      x: Math.random(),
      y: Math.random() * 0.75,
      r: 0.6 + Math.random() * 1.4,
      tw: Math.random() * Math.PI * 2
    }));

    // Tương tác xoay / zoom
    let yaw = 0.4;
    let pitch = 0.12;
    let zoom = 6.2;
    let dragging = false;
    let lastX = 0, lastY = 0;

    canvas.addEventListener("pointerdown", (e) => {
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
    });
    window.addEventListener("pointerup", () => { dragging = false; });
    window.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      yaw += (e.clientX - lastX) * 0.008;
      pitch = Math.max(-0.6, Math.min(0.65, pitch + (e.clientY - lastY) * 0.006));
      lastX = e.clientX;
      lastY = e.clientY;
    });
    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      zoom = Math.max(3.8, Math.min(10.5, zoom + e.deltaY * 0.003));
    }, { passive: false });

    // --- Web Audio Synth ---
    let audioCtx = null;
    let musicTimer = null;
    let musicOn = false;
    let stepIdx = 0;

    // Giai điệu gợi nhớ Last Christmas / mùa đông (D - Bm - Em - A)
    const notes = [
      587.33, 587.33, 523.25, 440.00, 392.00, 440.00, 587.33, 659.25,
      587.33, 493.88, 440.00, 392.00, 329.63, 392.00, 493.88, 587.33,
      659.25, 659.25, 587.33, 493.88, 440.00, 392.00, 329.63, 440.00,
      440.00, 493.88, 587.33, 659.25, 587.33, 493.88, 440.00, 369.99
    ];

    function playStep() {
      if (!audioCtx || !musicOn) return;
      const now = audioCtx.currentTime;
      const freq = notes[stepIdx % notes.length];
      stepIdx++;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.06, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.36);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.38);
    }

    const soundBtn = document.getElementById("soundBtn");
    soundBtn.addEventListener("click", () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      musicOn = !musicOn;
      soundBtn.textContent = musicOn ? "Tắt nhạc" : "Bật nhạc";
      clearInterval(musicTimer);
      if (musicOn) {
        playStep();
        musicTimer = setInterval(playStep, 280);
      }
    });

    // --- Điều khiển & Vòng lặp ---
    let paused = false;
    let simTime = 0;
    let lastFrame = performance.now();

    const pauseBtn = document.getElementById("pauseBtn");
    pauseBtn.addEventListener("click", () => {
      paused = !paused;
      pauseBtn.textContent = paused ? "Tiếp tục" : "Tạm dừng";
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      simTime = 0;
      yaw = 0.4;
      pitch = 0.12;
      zoom = 6.2;
    });

    function project(x, y, z) {
      // Xoay quanh trục Y
      const cy = Math.cos(yaw), sy = Math.sin(yaw);
      let x1 = x * cy - z * sy;
      let z1 = x * sy + z * cy;

      // Xoay quanh trục X
      const cp = Math.cos(pitch), sp = Math.sin(pitch);
      let y2 = y * cp - z1 * sp;
      let z2 = y * sp + z1 * cp;

      const dist = z2 + zoom;
      if (dist <= 0.2) return null;
      const fov = Math.min(W, H) * 0.78;
      const scale = fov / dist;
      return {
        sx: W * 0.5 + x1 * scale,
        sy: H * 0.48 + y2 * scale,
        z: z2,
        scale
      };
    }

    function render(now) {
      const dt = Math.min(0.05, (now - lastFrame) / 1000);
      lastFrame = now;
      if (!paused) {
        simTime += dt;
        yaw += dt * 0.45;
      }

      // Chữ chúc mừng gõ dần
      const typedLen = Math.min(customMsg.length, Math.floor(simTime * 11));
      msgEl.textContent = customMsg.slice(0, typedLen) + (typedLen < customMsg.length ? "_" : "");

      ctx.clearRect(0, 0, W, H);

      // Sao trời
      for (const s of stars) {
        const alpha = 0.35 + 0.65 * Math.abs(Math.sin(simTime * 1.8 + s.tw));
        ctx.fillStyle = `rgba(220, 235, 255, ${alpha.toFixed(2)})`;
        ctx.beginPath();
        ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Tuyết rơi
      ctx.font = "13px monospace";
      ctx.fillStyle = "rgba(215, 235, 255, 0.72)";
      for (const fl of snow) {
        if (!paused) {
          fl.y += fl.speed * dt;
          fl.x += Math.sin(simTime * 1.4 + fl.drift) * 0.25 * dt;
          if (fl.y > 3.5) {
            fl.y = -3.8;
            fl.x = (Math.random() - 0.5) * 10;
          }
        }
        const p = project(fl.x, fl.y, fl.z);
        if (p) ctx.fillText("*", p.sx, p.sy);
      }

      // Chiếu và sắp xếp theo độ sâu z
      const projected = [];
      for (const pt of points) {
        const p = project(pt.x, pt.y, pt.z);
        if (p) projected.push({ ...pt, ...p });
      }
      projected.sort((a, b) => b.z - a.z);

      for (const item of projected) {
        const fontSize = Math.max(9, Math.min(22, item.scale * 0.036));
        ctx.font = `bold ${fontSize.toFixed(1)}px monospace`;
        if (item.glow) {
          const pulse = 0.65 + 0.35 * Math.sin(simTime * 5 + item.phase);
          ctx.shadowColor = item.color;
          ctx.shadowBlur = 10 * pulse;
        } else {
          ctx.shadowBlur = 0;
        }
        ctx.fillStyle = item.color;
        ctx.fillText(item.char, item.sx, item.sy);
      }
      ctx.shadowBlur = 0;

      // Ngôi sao đỉnh cây
      const starProj = project(0, -2.42, 0);
      if (starProj) {
        const burst = Math.abs(Math.sin(simTime * 2.2)) > 0.94;
        const sSize = Math.max(18, starProj.scale * 0.065);
        ctx.save();
        ctx.translate(starProj.sx, starProj.sy);
        ctx.rotate(simTime * 0.6);
        ctx.font = `bold ${sSize.toFixed(1)}px monospace`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.shadowColor = burst ? "#ffffff" : "#ffd166";
        ctx.shadowBlur = burst ? 24 : 14;
        ctx.fillStyle = burst ? "#ffffff" : "#ffd166";
        ctx.fillText("★", 0, 0);
        ctx.restore();
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
